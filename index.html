<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/alink/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="ALink - 现代化自定义网页聚合与分类导航平台" />
    <title>ALink - 网页聚合与分类导航</title>
    <script>
      // Initialize theme early to avoid FOUC
      try {
        const theme = localStorage.getItem('alink_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/alink/assets/index-Dx3hba23.js"></script>
    <link rel="stylesheet" crossorigin href="/alink/assets/index-CtpS3hlQ.css">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="app"></div>
  </body>
</html>
