<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    .bg {
      fill: #000000;
      stroke: #27272a;
    }
    .fg {
      stroke: #ffffff;
    }
    .accent {
      stroke: #ff3366;
    }
    @media (prefers-color-scheme: dark) {
      .bg {
        fill: #000000;
        stroke: #ffffff;
      }
    }
  </style>
  <rect class="bg" x="1" y="1" width="30" height="30" stroke-width="2" />
  <g transform="rotate(-45 16 16)">
    <!-- Upper sharp rectangular chain loop (0 radius) -->
    <path class="fg" d="M14 11 H7 V21 H14" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter" />
    <!-- Lower sharp rectangular chain loop (0 radius) -->
    <path class="fg" d="M18 11 H25 V21 H18" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter" />
    <!-- High-contrast center link pin in accent #ff3366 -->
    <line class="accent" x1="11" y1="16" x2="21" y2="16" stroke-width="3.2" stroke-linecap="square" />
  </g>
</svg>